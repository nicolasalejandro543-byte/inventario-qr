<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Inventario QR{% endblock %} - Sky Composite</title>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        :root {
            --color-primary: #0173c6;
            --color-bg: #e8f1f8;
            --color-bg-light: #f5f9fc;
            --color-text: #1a1a2e;
            --color-text-muted: #64748b;
            --color-cyan: #33b1d7;
            --color-section: #2596be;
            --color-success: #10b981;
            --color-warning: #f59e0b;
            --color-danger: #ef4444;
            --color-purple: #6f42c1;
            --color-gray: #9f9c9b;
            --color-gray-light: #e5e7eb;
            --shadow-sm: 0 1px 2px rgba(0,0,0,0.05);
            --shadow-md: 0 4px 6px -1px rgba(0,0,0,0.1);
            --shadow-lg: 0 10px 15px -3px rgba(0,0,0,0.1);
            --radius-sm: 6px;
            --radius-md: 10px;
            --radius-lg: 16px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'DM Sans', sans-serif;
            background: linear-gradient(135deg, var(--color-bg) 0%, #dce9f0 100%);
            color: var(--color-text);
            min-height: 100vh;
            line-height: 1.5;
        }

        .app-container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
        }

        /* Header */
        .app-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: linear-gradient(135deg, var(--color-primary), var(--color-section));
            padding: 16px 28px;
            border-radius: var(--radius-lg);
            margin-bottom: 20px;
            box-shadow: var(--shadow-lg);
        }

        .logo-section {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .logo-icon {
            width: 48px;
            height: 48px;
            background: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            font-weight: 700;
            color: var(--color-primary);
        }

        .app-title {
            color: white;
            font-size: 1.5rem;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        .app-subtitle {
            color: rgba(255,255,255,0.85);
            font-size: 0.9rem;
        }

        .header-nav {
            display: flex;
            gap: 12px;
        }

        .header-nav a {
            color: white;
            text-decoration: none;
            padding: 8px 16px;
            border-radius: var(--radius-sm);
            font-weight: 500;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .header-nav a:hover {
            background: rgba(255,255,255,0.2);
        }

        .header-nav a.active {
            background: rgba(255,255,255,0.25);
        }

        /* Cards */
        .card {
            background: white;
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-md);
            overflow: hidden;
            border: none;
        }

        .card-header {
            padding: 16px 20px;
            background: linear-gradient(135deg, var(--color-section), var(--color-cyan));
            color: white;
            font-weight: 600;
        }

        .card-header.primary {
            background: linear-gradient(135deg, var(--color-primary), #0284c7);
        }

        .card-body {
            padding: 20px;
        }

        /* Buttons */
        .btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 12px 24px;
            border: none;
            border-radius: var(--radius-sm);
            font-family: inherit;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            text-decoration: none;
        }

        .btn-primary {
            background: var(--color-primary);
            color: white;
        }

        .btn-primary:hover {
            background: #005a9e;
            transform: translateY(-1px);
            box-shadow: var(--shadow-md);
        }

        .btn-success {
            background: var(--color-success);
            color: white;
        }

        .btn-success:hover {
            background: #059669;
        }

        .btn-warning {
            background: var(--color-warning);
            color: white;
        }

        .btn-secondary {
            background: var(--color-gray-light);
            color: var(--color-text);
        }

        .btn-secondary:hover {
            background: #d1d5db;
        }

        .btn-outline {
            background: transparent;
            border: 2px solid var(--color-gray-light);
            color: var(--color-text);
        }

        .btn-outline:hover {
            border-color: var(--color-primary);
            color: var(--color-primary);
        }

        /* Forms */
        .form-group {
            margin-bottom: 16px;
        }

        .form-group label {
            display: block;
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--color-text);
            margin-bottom: 6px;
        }

        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 10px 14px;
            border: 2px solid var(--color-gray-light);
            border-radius: var(--radius-sm);
            font-family: inherit;
            font-size: 0.95rem;
            transition: all 0.2s ease;
            background: white;
        }

        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: var(--color-primary);
            box-shadow: 0 0 0 3px rgba(1,115,198,0.1);
        }

        .form-row {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }

        .form-row .form-group {
            flex: 1;
            min-width: 150px;
        }

        /* Tables */
        .table {
            width: 100%;
            border-collapse: collapse;
        }

        .table th {
            background: var(--color-primary);
            color: white;
            padding: 12px;
            text-align: left;
            font-weight: 600;
        }

        .table td {
            padding: 12px;
            border-bottom: 1px solid var(--color-gray-light);
        }

        .table tr:hover {
            background: var(--color-bg-light);
        }

        /* Badge */
        .badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 600;
        }

        /* Utilities */
        .text-muted { color: var(--color-text-muted); }
        .text-success { color: var(--color-success); }
        .text-warning { color: var(--color-warning); }
        .text-danger { color: var(--color-danger); }
        .text-primary { color: var(--color-primary); }

        .font-mono { font-family: 'JetBrains Mono', monospace; }

        .mb-3 { margin-bottom: 16px; }
        .mt-3 { margin-top: 16px; }
        .mb-4 { margin-bottom: 24px; }
        .mt-4 { margin-top: 24px; }

        /* Responsive */
        @media (max-width: 768px) {
            .app-container {
                padding: 10px;
            }

            .app-header {
                flex-direction: column;
                gap: 12px;
                text-align: center;
                padding: 12px 16px;
                border-radius: var(--radius-md);
            }

            .logo-icon {
                width: 40px;
                height: 40px;
                font-size: 18px;
            }

            .app-title {
                font-size: 1.2rem;
            }

            .app-subtitle {
                font-size: 0.8rem;
            }

            .header-nav {
                width: 100%;
                justify-content: center;
                gap: 8px;
            }

            .header-nav a {
                padding: 10px 16px;
                font-size: 0.9rem;
                flex: 1;
                justify-content: center;
            }

            .form-row {
                flex-direction: column;
            }

            .btn {
                padding: 10px 16px;
                font-size: 0.9rem;
            }
        }

        @media (max-width: 480px) {
            .header-nav a span {
                display: none;
            }

            .header-nav a {
                padding: 12px 16px;
            }

            .header-nav a i {
                font-size: 1.2rem;
            }
        }
    </style>
    {% block head %}{% endblock %}
</head>
<body>
    <div class="app-container">
        <!-- Header -->
        <header class="app-header">
            <div class="logo-section">
                <div class="logo-icon">SC</div>
                <div>
                    <h1 class="app-title">Sky Composite</h1>
                    <p class="app-subtitle">Sistema de Inventario QR</p>
                </div>
            </div>
            <nav class="header-nav">
                <a href="/recepcion"><i class="bi bi-truck"></i> <span>Recepcion</span></a>
                <a href="/"><i class="bi bi-grid-3x3-gap"></i> <span>Procesos</span></a>
                <a href="/scanner"><i class="bi bi-qr-code-scan"></i> <span>Scanner</span></a>
                <a href="/nuevo"><i class="bi bi-plus-circle"></i> <span>Nuevo</span></a>
            </nav>
        </header>

        <main>
            {% block content %}{% endblock %}
        </main>
    </div>

    {% block scripts %}{% endblock %}
</body>
</html>
