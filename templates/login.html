<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesion - Sky Composite</title>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        :root {
            --color-primary: #0173c6;
            --color-bg: #e8f1f8;
            --color-section: #2596be;
            --color-cyan: #33b1d7;
            --color-text: #1a1a2e;
            --color-text-muted: #64748b;
            --color-danger: #ef4444;
            --color-gray-light: #e5e7eb;
            --shadow-lg: 0 10px 15px -3px rgba(0,0,0,0.1);
            --radius-md: 10px;
            --radius-lg: 16px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'DM Sans', sans-serif;
            background: linear-gradient(135deg, var(--color-bg) 0%, #dce9f0 100%);
            color: var(--color-text);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .login-container {
            width: 100%;
            max-width: 400px;
        }

        .login-card {
            background: white;
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-lg);
            overflow: hidden;
        }

        .login-header {
            background: linear-gradient(135deg, var(--color-primary), var(--color-section));
            padding: 32px 24px;
            text-align: center;
        }

        .logo-icon {
            width: 72px;
            height: 72px;
            background: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            font-weight: 700;
            color: var(--color-primary);
            margin: 0 auto 16px;
        }

        .login-title {
            color: white;
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 4px;
        }

        .login-subtitle {
            color: rgba(255,255,255,0.85);
            font-size: 0.9rem;
        }

        .login-body {
            padding: 32px 24px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--color-text);
            margin-bottom: 8px;
        }

        .input-wrapper {
            position: relative;
        }

        .input-wrapper i {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--color-text-muted);
            font-size: 1.1rem;
        }

        .form-group input {
            width: 100%;
            padding: 14px 14px 14px 44px;
            border: 2px solid var(--color-gray-light);
            border-radius: var(--radius-md);
            font-family: inherit;
            font-size: 1rem;
            transition: all 0.2s ease;
        }

        .form-group input:focus {
            outline: none;
            border-color: var(--color-primary);
            box-shadow: 0 0 0 3px rgba(1,115,198,0.1);
        }

        .error-message {
            background: #fef2f2;
            border: 1px solid #fecaca;
            color: var(--color-danger);
            padding: 12px 16px;
            border-radius: var(--radius-md);
            margin-bottom: 20px;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn-login {
            width: 100%;
            padding: 14px 24px;
            background: linear-gradient(135deg, var(--color-primary), var(--color-section));
            color: white;
            border: none;
            border-radius: var(--radius-md);
            font-family: inherit;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 16px rgba(1,115,198,0.3);
        }

        .btn-login:active {
            transform: translateY(0);
        }

        @media (max-width: 480px) {
            .login-header {
                padding: 24px 20px;
            }

            .logo-icon {
                width: 60px;
                height: 60px;
                font-size: 26px;
            }

            .login-title {
                font-size: 1.3rem;
            }

            .login-body {
                padding: 24px 20px;
            }
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-card">
            <div class="login-header">
                <div class="logo-icon">SC</div>
                <h1 class="login-title">Sky Composite</h1>
                <p class="login-subtitle">Sistema de Inventario QR</p>
            </div>
            <div class="login-body">
                {% if error %}
                <div class="error-message">
                    <i class="bi bi-exclamation-circle"></i>
                    {{ error }}
                </div>
                {% endif %}

                <form method="POST" action="{{ url_for('login') }}">
                    <div class="form-group">
                        <label for="username">Usuario</label>
                        <div class="input-wrapper">
                            <i class="bi bi-person"></i>
                            <input type="text" id="username" name="username" placeholder="Ingresa tu usuario" required autocomplete="username">
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="password">Contrasena</label>
                        <div class="input-wrapper">
                            <i class="bi bi-lock"></i>
                            <input type="password" id="password" name="password" placeholder="Ingresa tu contrasena" required autocomplete="current-password">
                        </div>
                    </div>

                    <button type="submit" class="btn-login">
                        <i class="bi bi-box-arrow-in-right"></i>
                        Iniciar Sesion
                    </button>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
